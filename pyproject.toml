[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contractive-tool"
version = "0.4.0"
description = "Probabilistic CFG, positivity certificates, and Python CVXPY/MOSEK tail-bound solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lark==1.2.2",
  "sympy==1.14.0",
]

[project.optional-dependencies]
solver = [
  "cvxpy==1.9.3",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "mosek==11.2.6",
]
test = [
  "pytest==8.3.5",
]

[project.scripts]
contractive = "contractive_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"contractive_tool.frontend" = ["grammar.lark"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
